version: 2

# Versions Dependabot cannot see (Node.js/npm for the client build, google-java-format, the Maven wrapper, gosu) are
# updated by .github/workflows/update-tool-versions.yml.

# All update PRs target the develop branch. This file itself must stay on the default branch (master), which is the
# only place Dependabot reads it from.
# Minor and patch updates are grouped into one PR per ecosystem per week; major updates get their own PRs.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Our own client module, not published to Maven Central.
      - dependency-name: "com.commafeed:commafeed-client"
      # io.quarkus artifacts share quarkus.version with io.quarkus.platform, which is released about a week later.
      # Following io.quarkus would bump the property before the matching platform BOM exists, so only follow
      # io.quarkus.platform.
      - dependency-name: "io.quarkus:*"

  - package-ecosystem: "npm"
    directory: "/commafeed-client"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase"
    groups:
      # Listed first because a dependency goes into the first group it matches; these must be updated together.
      react-querybuilder:
        patterns: ["react-querybuilder", "@react-querybuilder/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/commafeed-server/src/main/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
