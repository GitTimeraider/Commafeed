name: ci
permissions:
  contents: read

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:
  # Lets rebuild-image.yml reuse this exact build; github.event_name is then the caller's (workflow_dispatch).
  workflow_call:

env:
  JAVA_VERSION: 25
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    # Dependabot branches are validated by their pull_request run; skip their push run so they don't publish
    # throwaway images tagged with Dependabot branch names.
    if: github.event_name != 'push' || github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Setup
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "graalvm"
          cache: "maven"

      - name: Set up NodeJS cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "npm"
          cache-dependency-path: 'commafeed-client/package-lock.json'

      # Build
      # -Ob is GraalVM's quick build mode: much faster native compile, slightly less optimized binary.
      # -H:PageSize=65536 is repeated from application.properties because this flag replaces it.
      # Pull requests (including Dependabot's) and the automated/* branches of update-tool-versions.yml run the
      # server and client unit tests (~20s) but skip the slow Playwright integration tests; pushes skip all tests so
      # images publish faster.
      - name: Build with Maven
        env:
          TEST_FLAGS: ${{ (github.event_name == 'pull_request' || startsWith(github.ref_name, 'automated/')) && '-DskipITs' || '-DskipTests' }}
        run: >
          mvn --batch-mode --no-transfer-progress install -Pnative -Ph2 $TEST_FLAGS
          -Dquarkus.native.additional-build-args=-H:PageSize=65536,-Ob

      - name: Upload native executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commafeed-native
          path: commafeed-server/target/commafeed-*-runner*

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    env:
      # Images are published for pushes and manual runs, but not for pull requests or the automated/* branches of
      # update-tool-versions.yml (those are validated like pull requests).
      PUBLISH: ${{ github.event_name != 'pull_request' && !startsWith(github.ref_name, 'automated/') }}

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Prepare artifacts
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commafeed-native
          path: ./artifacts

      - name: Set the exec flag on the native executable
        run: chmod +x artifacts/*-runner

      - name: Rename native executable to match buildx TARGETARCH
        run: |
          for f in artifacts/*-runner; do
            mv "$f" "$(echo "$f" | sed 's/x86_64/amd64/')"
          done

      # Compute a lowercase, tag-safe image reference for GHCR.
      # github.* values are passed through env instead of ${{ }} inside the script: branch names may contain
      # characters like ' $( ; that would otherwise be executed as shell code.
      - name: Compute GHCR image reference
        if: ${{ env.PUBLISH == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          GHCR_IMAGE="ghcr.io/${REPOSITORY,,}"
          # Docker tags only allow [A-Za-z0-9_.-], can't start with '.' or '-', and are at most 128 characters.
          GHCR_TAG_REF="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-100)"
          GHCR_TAG_REF="${GHCR_TAG_REF:-branch}"
          GHCR_SHORT_SHA="${SHA:0:7}"

          TAGS=("${GHCR_IMAGE}:${GHCR_TAG_REF}" "${GHCR_IMAGE}:${GHCR_TAG_REF}-${GHCR_SHORT_SHA}")
          if [ "$REF_NAME" = "master" ]; then
            TAGS+=("${GHCR_IMAGE}:latest")
          fi

          {
            echo "GHCR_TAGS<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.PUBLISH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ## build but don't push for PRs (including Dependabot's) and automated/* branches, just to validate the Dockerfile
      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ env.PUBLISH != 'true' }}
        with:
          context: .
          file: commafeed-server/src/main/docker/Dockerfile.native
          push: false
          platforms: linux/amd64

      ## build and push to GHCR on every commit (any branch) and on manual runs, but not for PRs or automated/* branches
      - name: Docker build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ env.PUBLISH == 'true' }}
        with:
          context: .
          file: commafeed-server/src/main/docker/Dockerfile.native
          push: true
          platforms: linux/amd64
          tags: ${{ env.GHCR_TAGS }}
