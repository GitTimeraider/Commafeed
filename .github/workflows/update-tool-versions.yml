name: Update tool versions
permissions:
  contents: read

# Complements Dependabot (.github/dependabot.yml) for the versions it can't see: Node.js and npm used by the client
# build, google-java-format, the Maven wrapper and gosu in the Docker image. Runs weekly on Monday like Dependabot and
# opens (or refreshes) a single pull request from the automated/tool-versions branch. Run it manually from the
# Actions tab: "Update tool versions" → "Run workflow". Like Dependabot's, the pull request targets the develop branch.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-tool-versions

env:
  BRANCH: automated/tool-versions
  BASE: develop
  JAVA_VERSION: 25

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the pull request
      actions: write # start the ci workflow on the update branch

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE }}

      # Same JDK as the ci workflow: the script runs Maven for the wrapper update and to check google-java-format
      # updates with the spotless plugin, and the runner's default JDK is too old for recent google-java-format.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "graalvm"
          cache: "maven"

      - name: Update versions
        env:
          CHANGES_FILE: ${{ runner.temp }}/changes.md
        run: ./.github/scripts/update-tool-versions.sh

      # Pushes and pull requests made with GITHUB_TOKEN don't trigger other workflows, so the ci workflow is started
      # explicitly; its result shows up in the pull request's checks.
      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_FILE: ${{ runner.temp }}/changes.md
        run: |
          if git diff --quiet; then
            echo "Everything is up to date"
            exit 0
          fi

          TITLE="Update tool versions"
          {
            echo "Updates versions that Dependabot doesn't track:"
            echo
            cat "$CHANGES_FILE"
            echo
            echo "Generated by the \`update-tool-versions\` workflow. The branch is force-pushed on every run, so"
            echo "commits pushed to it by hand are overwritten the next time a new version is found."
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -a -m "$TITLE" -m "$(cat "$CHANGES_FILE")"

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          # Nothing new since the last run: leave the branch and its CI results alone. Without an open pull request
          # (opening it failed last time) the branch is still re-pushed so the pull request is retried.
          if [ -n "$PR" ] && git fetch --depth=1 origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "$BRANCH already has these versions"
            exit 0
          fi

          git push --force origin "$BRANCH"

          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          elif ! gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::$BRANCH was pushed but the pull request could not be opened. If the error above says" \
              "GitHub Actions is not permitted to create pull requests, enable \"Allow GitHub Actions to create and" \
              "approve pull requests\" in Settings → Actions → General → Workflow permissions, then re-run this workflow."
            exit 1
          fi

          gh workflow run ci.yml --ref "$BRANCH"
